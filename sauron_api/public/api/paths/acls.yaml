get:
  security:
    - BearerAuth: []
  summary: List the ACLs of a server (paginated)
  tags: [ acls ]
  description: >
    Returns the ACLs defined on a server plus the four global built-ins
    (any, none, localhost, localnets) in the paginated {data, metadata}
    envelope. Requires server read access and authorization level
    ALEVEL_ACLS (superuser bypasses).
  operationId: list_acls
  x-mojo-name: list_acls
  x-mojo-to: "Acl#list_acls"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/acl_name'
    - $ref: '../components/parameters.yaml#/acl_comment'
    - $ref: '../components/parameters.yaml#/acl_sort'
  responses:
    '200':
      description: Paginated list of ACLs in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AclListResponse'
    '400':
      description: Invalid filter or sort value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create an ACL
  tags: [ acls ]
  description: Creates an ACL on the specified server. Requires superuser.
  operationId: create_acl
  x-mojo-name: create_acl
  x-mojo-to: "Acl#create_acl"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewAcl'
  responses:
    '201':
      description: ACL created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Acl'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: An ACL with this name already exists on the server
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
