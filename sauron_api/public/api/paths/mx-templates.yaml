get:
  security:
    - BearerAuth: []
  summary: List the MX templates of a zone (paginated)
  tags: [ mx-templates ]
  description: >
    Returns the zone's MX templates in the paginated {data, metadata} envelope.
    Requires server read access.
  operationId: list_mx_templates
  x-mojo-name: list_mx_templates
  x-mojo-to: "Templates::MxTemplate#list_mx_templates"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/template_name'
    - $ref: '../components/parameters.yaml#/template_comment'
    - $ref: '../components/parameters.yaml#/template_alevel'
    - $ref: '../components/parameters.yaml#/template_sort'
  responses:
    '200':
      description: Paginated list of MX templates in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MxTemplateListResponse'
    '400':
      description: Invalid filter or sort value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server or zone not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create an MX template
  tags: [ mx-templates ]
  description: >
    Creates a zone-scoped MX template. Requires server read access and a
    template name matching the caller's template mask (tmplmask). Superuser
    bypasses the mask.
  operationId: create_mx_template
  x-mojo-name: create_mx_template
  x-mojo-to: "Templates::MxTemplate#create_mx_template"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewMxTemplate'
  responses:
    '201':
      description: MX template created
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MxTemplate'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server or zone not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
