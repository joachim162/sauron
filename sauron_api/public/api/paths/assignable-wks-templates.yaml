get:
  security:
    - BearerAuth: []
  summary: List WKS templates assignable to a host
  tags: [ wks-templates ]
  description: >
    Bare-array picker helper for the host form: returns the server's WKS
    templates with alevel at or below the caller's authorization level,
    mirroring the legacy get_wks_template_list picker (superuser sees all —
    the legacy picker would constrain even a superuser by their alevel).
  operationId: list_assignable_wks_templates
  x-mojo-name: list_assignable_wks_templates
  x-mojo-to: "Templates::WksTemplate#list_assignable_wks_templates"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  responses:
    '200':
      description: A list of assignable WKS templates
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas.yaml#/AssignableWksTemplate'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
