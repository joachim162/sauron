post:
  security: []
  summary: Change own password
  tags: [ auth ]
  description: >
    Changes the authenticated user's local password after verifying the
    current one. Only available when password login is enabled for this API
    (auth.mode is password or both) and the account has a stored local
    password; passwordless (proxy/SSO-created) accounts cannot use it.
    Sessions and personal access tokens remain valid. Returns 403 when
    password login is disabled or the current password check fails.
  operationId: change_password
  x-mojo-name: change_password
  x-mojo-to: "Auth#change_password"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/ChangePasswordRequest'
  responses:
    '200':
      description: Password changed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Password changed
    '400':
      description: Missing or invalid fields
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '403':
      description: Password login disabled or current password is incorrect
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: Account has no local password (proxy/SSO-only)
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '500':
      $ref: '../components/responses.yaml#/Error'
