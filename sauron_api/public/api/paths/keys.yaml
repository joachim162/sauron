get:
  security:
    - BearerAuth: []
  summary: List the TSIG keys of a server (paginated, read-only)
  tags: [ keys ]
  description: >
    Returns the TSIG keys defined on a server in the paginated
    {data, metadata} envelope. Key secrets are never exposed; the key
    lifecycle is managed by the keygen CLI outside the API. Requires server
    read access and authorization level ALEVEL_ACLS (superuser bypasses).
  operationId: list_keys
  x-mojo-name: list_keys
  x-mojo-to: "Key#list_keys"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/key_name'
    - $ref: '../components/parameters.yaml#/key_comment'
    - $ref: '../components/parameters.yaml#/key_sort'
  responses:
    '200':
      description: Paginated list of keys in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/KeyListResponse'
    '400':
      description: Invalid filter or sort value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
