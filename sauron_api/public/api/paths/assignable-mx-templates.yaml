get:
  security:
    - BearerAuth: []
  summary: List MX templates assignable to a host
  tags: [ mx-templates ]
  description: >
    Bare-array picker helper for the host form: returns the zone's MX templates
    with alevel at or below the caller's authorization level, mirroring the
    legacy get_mx_template_list picker (superuser sees all — the legacy picker
    would constrain even a superuser by their alevel).
  operationId: list_assignable_mx_templates
  x-mojo-name: list_assignable_mx_templates
  x-mojo-to: "Templates::MxTemplate#list_assignable_mx_templates"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
  responses:
    '200':
      description: A list of assignable MX templates
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas.yaml#/AssignableMxTemplate'
    '404':
      description: Server or zone not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
