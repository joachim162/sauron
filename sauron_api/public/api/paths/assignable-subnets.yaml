get:
  security:
    - BearerAuth: []
  summary: List subnets available for host IP assignment
  tags: [ networks ]
  description: >
    Returns subnets (subnet=true) that the current user is allowed to
    assign host IPs from. Filtered by the user's authorization level
    and net-level rights (rtype=3). Used by the host create form to
    populate the subnet dropdown.
  operationId: list_assignable_subnets
  x-mojo-name: list_assignable_subnets
  x-mojo-to: "Net#list_assignable_subnets"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  responses:
    '200':
      description: A list of assignable subnets
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas.yaml#/NetList'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
