get:
  security:
    - BearerAuth: []
  summary: List all hosts in a zone
  tags: [ hosts ]
  description: Returns all host records within the specified zone.
  operationId: list_hosts
  x-mojo-name: list_hosts
  x-mojo-to: "Host#list_hosts"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/host_q'
    - $ref: '../components/parameters.yaml#/host_domain'
    - $ref: '../components/parameters.yaml#/host_type'
    - $ref: '../components/parameters.yaml#/host_ip'
    - $ref: '../components/parameters.yaml#/host_group'
    - $ref: '../components/parameters.yaml#/host_txt'
    - $ref: '../components/parameters.yaml#/host_mx'
    - $ref: '../components/parameters.yaml#/host_sort'
    - $ref: '../components/parameters.yaml#/host_ether'
    - $ref: '../components/parameters.yaml#/host_duid'
    - $ref: '../components/parameters.yaml#/host_iaid'
    - $ref: '../components/parameters.yaml#/host_info'
    - $ref: '../components/parameters.yaml#/host_huser'
    - $ref: '../components/parameters.yaml#/host_location'
    - $ref: '../components/parameters.yaml#/host_dept'
    - $ref: '../components/parameters.yaml#/host_model'
    - $ref: '../components/parameters.yaml#/host_serial'
    - $ref: '../components/parameters.yaml#/host_misc'
    - $ref: '../components/parameters.yaml#/host_asset_id'
    - $ref: '../components/parameters.yaml#/host_hinfo'
    - $ref: '../components/parameters.yaml#/host_dhcp_date_from'
    - $ref: '../components/parameters.yaml#/host_dhcp_date_to'
    - $ref: '../components/parameters.yaml#/host_dhcp_last_from'
    - $ref: '../components/parameters.yaml#/host_dhcp_last_to'
    - $ref: '../components/parameters.yaml#/host_cdate_from'
    - $ref: '../components/parameters.yaml#/host_cdate_to'
    - $ref: '../components/parameters.yaml#/host_mdate_from'
    - $ref: '../components/parameters.yaml#/host_mdate_to'
    - $ref: '../components/parameters.yaml#/host_expiration_from'
    - $ref: '../components/parameters.yaml#/host_expiration_to'
  responses:
    '200':
      description: A paginated list of hosts
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/HostListResponse'
    '400':
      description: Invalid filter, sort or date value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server or zone not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create a new host
  tags: [ hosts ]
  description: Creates a new host record in the specified zone on the specified server.
  operationId: add_host
  x-mojo-name: add_host
  x-mojo-to: "Host#add_host"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewHost'
  responses:
    '201':
      description: Host created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Host'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server or zone not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: Host already exists in this zone
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
