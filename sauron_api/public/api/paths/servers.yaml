get:
  security:
    - BearerAuth: []
  summary: List the servers managed by Sauron (paginated)
  tags: [ servers ]
  description: >
    Returns the DNS/DHCP servers managed by Sauron in the paginated
    {data, metadata} envelope. Only servers the caller may read are
    included, and totals are computed over that permission-filtered set.
  operationId: list_servers
  x-mojo-name: list_servers
  x-mojo-to: "Server#list_servers"
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page (1..100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
        example: 50
  responses:
    '200':
      description: Paginated list of servers in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ServerListResponse'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create a new server
  tags: [ servers ]
  description: Adds a new DNS/DHCP server to the system.
  operationId: add_server
  x-mojo-name: add_server
  x-mojo-to: "Server#add_server"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewServer'
  responses:
    '201':
      description: Server created successfully
      headers:
        Location:
          description: Absolute URL of the newly created server resource
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Server'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: Server already exists
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
