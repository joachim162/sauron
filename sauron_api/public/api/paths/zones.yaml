get:
  security:
    - BearerAuth: []
  summary: List zones for a server
  tags: [ zones ]
  description: Returns all zones managed by a specific DNS server.
  operationId: list_zones
  x-mojo-name: list_zones
  x-mojo-to: "Zone#list_zones"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  responses:
    '200':
      description: A list of zones
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas.yaml#/Zone'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create a new zone
  tags: [ zones ]
  description: Adds a new DNS zone to a specific server.
  operationId: create_zone
  x-mojo-name: create_zone
  x-mojo-to: "Zone#create_zone"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewZone'
  responses:
    '201':
      description: Zone created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Zone'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: Zone already exists
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
