get:
  security:
    - BearerAuth: []
  summary: List the zones of a server (paginated)
  tags: [ zones ]
  description: >
    Returns the zones managed by a specific DNS server in the paginated
    {data, metadata} envelope. Only zones the caller may read are included,
    and totals are computed over that permission-filtered set.
  operationId: list_zones
  x-mojo-name: list_zones
  x-mojo-to: "Zone#list_zones"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/zone_name'
    - $ref: '../components/parameters.yaml#/zone_type'
    - $ref: '../components/parameters.yaml#/zone_reverse'
    - $ref: '../components/parameters.yaml#/zone_comment'
    - $ref: '../components/parameters.yaml#/zone_expiration_from'
    - $ref: '../components/parameters.yaml#/zone_expiration_to'
    - $ref: '../components/parameters.yaml#/zone_sort'
  responses:
    '200':
      description: Paginated list of zones in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ZoneListResponse'
    '400':
      description: Invalid filter, sort or date value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create a new zone
  tags: [ zones ]
  description: Adds a new DNS zone to a specific server.
  operationId: create_zone
  x-mojo-name: create_zone
  x-mojo-to: "Zone#create_zone"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewZone'
  responses:
    '201':
      description: Zone created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Zone'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: Zone already exists
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
