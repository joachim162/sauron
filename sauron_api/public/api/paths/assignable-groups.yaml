get:
  security:
    - BearerAuth: []
  summary: List groups assignable to a host
  tags: [ groups ]
  description: >
    Returns the groups that may be assigned to a host, filtered by the
    caller's authorization level (alevel ceiling) and by the group types
    allowed for the requested slot (legacy get_group_list parity). This is
    an unpaginated bare array used to populate the host form pickers,
    mirroring assignable-subnets.
  operationId: list_assignable_groups
  x-mojo-name: list_assignable_groups
  x-mojo-to: "Group#list_assignable_groups"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - name: role
      in: query
      required: false
      description: >
        Assignment slot. 'base' allows normal and dynamic_pool groups;
        'subgroup' additionally allows dhcp_class groups. custom_dhcp_class
        is never assignable.
      schema:
        type: string
        enum: [ base, subgroup ]
        default: base
  responses:
    '200':
      description: A list of assignable groups
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas.yaml#/GroupAssignee'
    '400':
      description: Invalid role value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
