get:
  security:
    - BearerAuth: []
  summary: List the VLANs of a server (paginated)
  tags: [ vlans ]
  description: >
    Returns the VLANs defined on a server in the paginated {data, metadata}
    envelope. Requires server read access and authorization level
    ALEVEL_VLANS (superuser bypasses).
  operationId: list_vlans
  x-mojo-name: list_vlans
  x-mojo-to: "Vlan#list_vlans"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/vlan_name'
    - $ref: '../components/parameters.yaml#/vlan_vlanno'
    - $ref: '../components/parameters.yaml#/vlan_description'
    - $ref: '../components/parameters.yaml#/vlan_comment'
    - $ref: '../components/parameters.yaml#/vlan_sort'
  responses:
    '200':
      description: Paginated list of VLANs in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/VlanListResponse'
    '400':
      description: Invalid filter or sort value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create a VLAN
  tags: [ vlans ]
  description: Creates a VLAN on the specified server. Requires superuser.
  operationId: create_vlan
  x-mojo-name: create_vlan
  x-mojo-to: "Vlan#create_vlan"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewVlan'
  responses:
    '201':
      description: VLAN created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Vlan'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: A VLAN with this name already exists on the server
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
