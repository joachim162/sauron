get:
  security:
    - BearerAuth: []
  summary: Get an MX template
  tags: [ mx-templates ]
  description: Returns the full MX template including its MX entry array and host_count.
  operationId: get_mx_template
  x-mojo-name: get_mx_template
  x-mojo-to: "Templates::MxTemplate#get_mx_template"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
    - $ref: '../components/parameters.yaml#/template_id'
  responses:
    '200':
      description: MX template record
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MxTemplate'
    '404':
      description: Server, zone, or template not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
put:
  security:
    - BearerAuth: []
  summary: Update an MX template
  tags: [ mx-templates ]
  description: >
    Partial update; mx_l uses replace-all semantics. Requires server read
    access and a template mask (tmplmask) matching both the current and the
    new name. Superuser bypasses the mask.
  operationId: update_mx_template
  x-mojo-name: update_mx_template
  x-mojo-to: "Templates::MxTemplate#update_mx_template"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
    - $ref: '../components/parameters.yaml#/template_id'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/UpdateMxTemplate'
  responses:
    '200':
      description: MX template updated
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MxTemplate'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server, zone, or template not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
delete:
  security:
    - BearerAuth: []
  summary: Delete an MX template
  tags: [ mx-templates ]
  description: >
    Deletes the template and its MX entries. Hosts referencing it are detached
    (mx=-1) unless reassign_to names another template in the same zone, to
    which they are moved first. Requires a template mask (tmplmask) matching
    the template name.
  operationId: delete_mx_template
  x-mojo-name: delete_mx_template
  x-mojo-to: "Templates::MxTemplate#delete_mx_template"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - $ref: '../components/parameters.yaml#/zone'
    - $ref: '../components/parameters.yaml#/template_id'
    - $ref: '../components/parameters.yaml#/template_reassign_to'
  responses:
    '204':
      description: MX template deleted
    '400':
      description: Invalid reassign_to
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server, zone, or template not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
