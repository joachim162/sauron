get:
  security:
    - BearerAuth: []
  summary: List the networks of a server (paginated)
  tags: [ networks ]
  description: >
    Returns network/subnet records on the specified server in the paginated
    {data, metadata} envelope. The list mode selects which records are
    included, mirroring the legacy CGI net browser; totals are computed
    over the whole filtered set.
  operationId: list_nets
  x-mojo-name: list_nets
  x-mojo-to: "Net#list_nets"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - name: list
      in: query
      required: false
      description: >
        List mode. 'top' shows top-level nets only (no subnets, no dummy
        nets); 'sub' shows nets and subnets but no dummy nets; 'all' shows
        every net record; 'free' additionally includes unallocated address
        blocks (gaps between subnets inside each top-level net) as pseudo
        records with id=-1. 'free' requires authorization level 3 or
        superuser; for other users it silently behaves like 'all'.
      schema:
        type: string
        enum: [ top, sub, all, free ]
        default: all
    - name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page (1..100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
        example: 50
  responses:
    '200':
      description: Paginated list of networks in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/NetListResponse'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'

post:
  security:
    - BearerAuth: []
  summary: Create a new network
  tags: [ networks ]
  description: Adds a new network/subnet to the specified server.
  operationId: add_net
  x-mojo-name: add_net
  x-mojo-to: "Net#add_net"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewNet'
  responses:
    '201':
      description: Network created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Net'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: Network already exists on this server
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
