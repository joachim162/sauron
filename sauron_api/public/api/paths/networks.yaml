get:
  security:
    - BearerAuth: []
  summary: List all networks on a server
  tags: [ networks ]
  description: Returns all network/subnet records on the specified server.
  operationId: list_nets
  x-mojo-name: list_nets
  x-mojo-to: "Net#list_nets"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
    - name: free
      in: query
      required: false
      description: >
        When true, unallocated address blocks (gaps between subnets inside
        each top-level net) are appended as pseudo records with id=-1.
        Requires authorization level 3 or superuser; for other users the
        flag is silently ignored.
      schema:
        type: boolean
    - name: page
      in: query
      required: false
      description: >
        Page number (1-based). Only takes effect together with per_page;
        see the response description for the dual response shape.
      schema:
        type: integer
        minimum: 1
        example: 1
    - name: per_page
      in: query
      required: false
      description: >
        Number of items per page (1..100). Only takes effect together
        with page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        example: 50
  responses:
    '200':
      description: >
        A list of networks. When neither page nor per_page is supplied the
        response is the legacy bare array of all matching networks (kept
        for existing consumers that filter list modes client-side). When
        both are supplied the response is the paginated
        {data, metadata} envelope, with totals computed over the whole
        filtered set (alevel restriction and free blocks included).
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  $ref: '../components/schemas.yaml#/NetList'
              - $ref: '../components/schemas.yaml#/NetListResponse'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'

post:
  security:
    - BearerAuth: []
  summary: Create a new network
  tags: [ networks ]
  description: Adds a new network/subnet to the specified server.
  operationId: add_net
  x-mojo-name: add_net
  x-mojo-to: "Net#add_net"
  parameters:
    - $ref: '../components/parameters.yaml#/server'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewNet'
  responses:
    '201':
      description: Network created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Net'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '404':
      description: Server not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: Network already exists on this server
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
