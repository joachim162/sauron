get:
  security:
    - BearerAuth: []
  summary: List printer classes (paginated)
  tags: [ printer-classes ]
  description: >
    Returns the global printer classes in the paginated {data, metadata}
    envelope. Any authenticated user may read them.
  operationId: list_printer_classes
  x-mojo-name: list_printer_classes
  x-mojo-to: "Templates::PrinterClass#list_printer_classes"
  parameters:
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/template_name'
    - $ref: '../components/parameters.yaml#/template_comment'
    - $ref: '../components/parameters.yaml#/printer_sort'
  responses:
    '200':
      description: Paginated list of printer classes in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PrinterClassListResponse'
    '400':
      description: Invalid filter or sort value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create a printer class
  tags: [ printer-classes ]
  description: >
    Creates a global printer class. The name must match ^@[a-zA-Z]+$.
    Requires superuser.
  operationId: create_printer_class
  x-mojo-name: create_printer_class
  x-mojo-to: "Templates::PrinterClass#create_printer_class"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewPrinterClass'
  responses:
    '201':
      description: Printer class created
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PrinterClass'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '409':
      description: A printer class with this name already exists
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
