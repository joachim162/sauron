get:
  security:
    - BearerAuth: []
  summary: List HINFO templates (paginated)
  tags: [ hinfo-templates ]
  description: >
    Returns the global HINFO templates in the paginated {data, metadata}
    envelope. Any authenticated user may read them; the list doubles as the
    host-form picker.
  operationId: list_hinfo_templates
  x-mojo-name: list_hinfo_templates
  x-mojo-to: "Templates::HinfoTemplate#list_hinfo_templates"
  parameters:
    - $ref: '../components/parameters.yaml#/page'
    - $ref: '../components/parameters.yaml#/per_page'
    - $ref: '../components/parameters.yaml#/hinfo_value'
    - $ref: '../components/parameters.yaml#/hinfo_type_filter'
    - $ref: '../components/parameters.yaml#/hinfo_pri'
    - $ref: '../components/parameters.yaml#/hinfo_sort'
  responses:
    '200':
      description: Paginated list of HINFO templates in the {data, metadata} envelope.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/HinfoTemplateListResponse'
    '400':
      description: Invalid filter or sort value
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '500':
      $ref: '../components/responses.yaml#/Error'
post:
  security:
    - BearerAuth: []
  summary: Create an HINFO template
  tags: [ hinfo-templates ]
  description: >
    Creates a global HINFO template. The value must match ^[A-Z0-9-+/]+$.
    Type defaults to hardware and priority to 100. Requires superuser.
  operationId: create_hinfo_template
  x-mojo-name: create_hinfo_template
  x-mojo-to: "Templates::HinfoTemplate#create_hinfo_template"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/NewHinfoTemplate'
  responses:
    '201':
      description: HINFO template created
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/HinfoTemplate'
    '400':
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Error'
    '401':
      $ref: '../components/responses.yaml#/UnauthorizedError'
    '403':
      $ref: '../components/responses.yaml#/ForbiddenError'
    '500':
      $ref: '../components/responses.yaml#/Error'
