      $ref: './components/schemas.yaml#/UpdateZone'
    HostType:
      $ref: './components/schemas.yaml#/HostType'
    HostFields:
      $ref: './components/schemas.yaml#/HostFields'
    Host:
      $ref: './components/schemas.yaml#/Host'
    HostListItem:
      $ref: './components/schemas.yaml#/HostListItem'
    HostListResponse:
      $ref: './components/schemas.yaml#/HostListResponse'
    NewHost:
