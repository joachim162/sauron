openapi: 3.0.4
info:
  title: Sauron REST API
  description: Modern RESTful interface for Sauron DNS/DHCP Management System.
  version: 1.0.0
servers:
  - url: /api/v1
    description: v1 API root

tags:
  - name: servers
    description: API Endpoints for Servers
  - name: hosts
    description: API Endpoints for Hosts
  - name: zones
    description: API Endpoints for Zones
  - name: auth
    description: Authentication Endpoints
  - name: networks
    description: API Endpoints for Networks
  - name: groups
    description: API Endpoints for Host Groups
  - name: vlans
    description: API Endpoints for VLANs

paths:
  /auth/login:
    $ref: "./paths/login.yaml"

  /auth/logout:
    $ref: "./paths/logout.yaml"

  /auth/me:
    $ref: "./paths/me.yaml"

  /auth/config:
    get:
      security: []
      summary: Get authentication configuration
      tags: [ auth ]
      description: >
        Returns the auth mode configured for this API instance.
        Used by the frontend to determine whether to show the password login
        form, the OIDC SSO button, or both.
      operationId: auth_config
      x-mojo-name: auth_config
      x-mojo-to: "Auth#config"
      responses:
        '200':
          description: Auth configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_mode:
                    type: string
                    enum: [password, oidc, both]
                    example: both
                  sso_url:
                    type: string
                    example: /api/v1/auth/sso

  /auth/sso:
    get:
      security: []
      summary: Authenticate via SSO/OIDC
      tags: [ auth ]
      description: >
        Redirects the user to the OIDC provider for authentication.
        Apache intercepts this endpoint and performs the OIDC flow.
        On success, a session cookie is set and the user is redirected
        to the configured frontend URL.
      operationId: auth_sso
      x-mojo-name: auth_sso
      x-mojo-to: "Auth#sso"
      parameters:
        - name: redirect
          in: query
          required: false
          description: URL to redirect to after successful authentication
          schema:
            type: string
            default: /app/
      responses:
        '302':
          description: Redirect to self or to the OIDC provider
        '200':
          description: Authenticated, redirected to the frontend

  /servers:
    $ref: "./paths/servers.yaml"

  /servers/{server}:
    $ref: "./paths/server.yaml"

  /servers/{server}/hosts:
    $ref: "./paths/server-hosts.yaml"

  /servers/{server}/zones/{zone}/hosts:
    $ref: "./paths/hosts.yaml"

  /servers/{server}/zones/{zone}/hosts/{hostname}:
    $ref: "./paths/host.yaml"

  /servers/{server}/zones/{zone}/hosts/{hostname}/copies:
    $ref: "./paths/host-copy.yaml"

  /servers/{server}/zones/{zone}/hosts/{hostname}/move:
    $ref: "./paths/host-move.yaml"

  /servers/{server}/zones:
    $ref: "./paths/zones.yaml"

  /servers/{server}/zones/{zone}:
    $ref: "./paths/zone.yaml"

  /servers/{server}/networks:
    $ref: "./paths/networks.yaml"

  /servers/{server}/networks/{net}:
    $ref: "./paths/network.yaml"

  /servers/{server}/assignable-subnets:
    $ref: "./paths/assignable-subnets.yaml"

  /servers/{server}/groups:
    $ref: "./paths/groups.yaml"

  /servers/{server}/groups/{group}:
    $ref: "./paths/group.yaml"

  /servers/{server}/assignable-groups:
    $ref: "./paths/assignable-groups.yaml"

  /servers/{server}/vlans:
    $ref: "./paths/vlans.yaml"

  /servers/{server}/vlans/{vlan}:
    $ref: "./paths/vlan.yaml"

