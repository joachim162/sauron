openapi: 3.0.4
info:
  title: Sauron REST API
  description: Modern RESTful interface for Sauron DNS/DHCP Management System.
  version: 1.0.0
servers:
  - url: /api/v1
    description: v1 API root

tags:
  - name: servers
    description: API Endpoints for Servers
  - name: hosts
    description: API Endpoints for Hosts
  - name: zones
    description: API Endpoints for Zones
  - name: auth
    description: Authentication endpoints

paths:
  /auth/login:
    $ref: "./paths/login.yaml"

  /auth/logout:
    $ref: "./paths/logout.yaml"

  /auth/me:
    $ref: "./paths/me.yaml"

  /servers:
    $ref: "./paths/servers.yaml"

  /servers/{server}:
    $ref: "./paths/server.yaml"

  /servers/{server}/zones/{zone}/hosts:
    $ref: "./paths/hosts.yaml"

  /servers/{server}/zones/{zone}/hosts/{hostname}:
    $ref: "./paths/host.yaml"

  /servers/{server}/zones:
    $ref: "./paths/zones.yaml"

  /servers/{server}/zones/{zone}:
    $ref: "./paths/zone.yaml"

components:
  schemas:
    ServerFields:
      $ref: './components/schemas.yaml#/ServerFields'
    Server:
      $ref: './components/schemas.yaml#/Server'
    NewServer:
      $ref: './components/schemas.yaml#/NewServer'
    UpdateServer:
      $ref: './components/schemas.yaml#/UpdateServer'
    ZoneFields:
      $ref: './components/schemas.yaml#/ZoneFields'
    Zone:
      $ref: './components/schemas.yaml#/Zone'
    NewZone:
      $ref: './components/schemas.yaml#/NewZone'
    UpdateZone:
      $ref: './components/schemas.yaml#/UpdateZone'
    HostFields:
      $ref: './components/schemas.yaml#/HostFields'
    Host:
      $ref: './components/schemas.yaml#/Host'
    NewHost:
      $ref: './components/schemas.yaml#/NewHost'
    UpdateHost:
      $ref: './components/schemas.yaml#/UpdateHost'
    LoginRequest:
      $ref: './components/schemas.yaml#/LoginRequest'
    User:
      $ref: './components/schemas.yaml#/User'
    UserResponse:
      $ref: './components/schemas.yaml#/UserResponse'
    Error:
      $ref: './components/schemas.yaml#/Error'

  responses:
    Error:
      $ref: './components/responses.yaml#/Error'
    UnauthorizedError:
      $ref: './components/responses.yaml#/UnauthorizedError'
    ForbiddenError:
      $ref: './components/responses.yaml#/ForbiddenError'

  parameters:
    server:
      $ref: './components/parameters.yaml#/server'
    zone:
      $ref: './components/parameters.yaml#/zone'
    hostname:
      $ref: './components/parameters.yaml#/hostname'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

