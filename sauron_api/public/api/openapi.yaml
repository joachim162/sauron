openapi: 3.0.4
info:
  title: Sauron REST API
  description: Modern RESTful interface for Sauron DNS/DHCP Management System.
  version: 1.0.0
servers:
  - url: /api/v1
    description: v1 API root

tags:
  - name: servers
    description: API Endpoints for Servers
  - name: hosts
    description: API Endpoints for Hosts
  - name: zones
    description: API Endpoints for Zones

paths:
  /servers:
    get:
      summary: List all servers
      tags: [ servers ]
      description: Returns a list of all DNS/DHCP servers managed by Sauron.
      operationId: list_servers
      x-mojo-name: list_servers
      x-mojo-to: "Server#list_servers"
      responses:
        '200':
          description: A list of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '500':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a new server
      tags: [ servers ]
      description: Adds a new DNS/DHCP server to the system.
      operationId: add_server
      x-mojo-name: add_server
      x-mojo-to: "Server#add_server"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServer'
      responses:
        '201':
          description: Server created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Server already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'

  /servers/{server}:
    get:
      summary: Get server details
      tags: [ servers ]
      description: Returns detailed information about a specific DNS/DHCP server.
      operationId: get_server
      x-mojo-name: get_server
      x-mojo-to: "Server#get_server"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      summary: Update an existing server
      tags: [ servers ]
      description: Updates an existing server configuration.
      operationId: update_server
      x-mojo-name: update_server
      x-mojo-to: "Server#update_server"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServer'
      responses:
        '200':
          description: Server updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a server
      tags: [ servers ]
      description: >
        Deletes a server and all associated zones, hosts, and related data.
        This operation is irreversible.
      operationId: delete_server
      x-mojo-name: delete_server
      x-mojo-to: "Server#delete_server"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
      responses:
        '204':
          description: Server deleted successfully
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'

  /servers/{server}/zones/{zone}/hosts:
    post:
      summary: Create a new host
      tags: [ hosts ]
      description: Creates a new host record in the specified zone on the specified server.
      operationId: add_host
      x-mojo-name: add_host
      x-mojo-to: "Host#add_host"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: middle-earth
        - name: zone
          in: path
          required: true
          description: Name of the zone
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: example.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewHost'
      responses:
        '201':
          description: Host created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Server or zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Host already exists in this zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'

  /servers/{server}/zones/{zone}/hosts/{hostname}:
    get:
      summary: Get host by hostname
      tags: [ hosts ]
      description: Returns detailed information about a specific host in the specified zone.
      operationId: get_host
      x-mojo-name: get_host
      x-mojo-to: "Host#get_host"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: middle-earth
        - name: zone
          in: path
          required: true
          description: Name of the zone
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: example.com
        - name: hostname
          in: path
          required: true
          description: Hostname within the zone (e.g., www, db01)
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: www
      responses:
        '200':
          description: Host details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '404':
          description: Server, zone, or host not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      summary: Update an existing host
      tags: [ hosts ]
      description: Updates an existing host record in the specified zone.
      operationId: update_host
      x-mojo-name: update_host
      x-mojo-to: "Host#update_host"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: middle-earth
        - name: zone
          in: path
          required: true
          description: Name of the zone
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: example.com
        - name: hostname
          in: path
          required: true
          description: Hostname within the zone (e.g., www, db01)
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: www
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHost'
      responses:
        '200':
          description: Host updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Server, zone, or host not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a host
      tags: [ hosts ]
      description: Deletes a host record from the specified zone.
      operationId: delete_host
      x-mojo-name: delete_host
      x-mojo-to: "Host#delete_host"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: middle-earth
        - name: zone
          in: path
          required: true
          description: Name of the zone
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: example.com
        - name: hostname
          in: path
          required: true
          description: Hostname within the zone (e.g., www, db01)
          x-mojo-placeholder: '#'
          schema:
            type: string
            example: www
      responses:
        '204':
          description: Host deleted successfully
        '404':
          description: Server, zone, or host not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'

  /servers/{server}/zones:
    post:
      summary: Create a new zone
      tags: [ zones ]
      description: Adds a new DNS zone to a specific server.
      operationId: create_zone
      x-mojo-name: create_zone
      x-mojo-to: "Zone#create_zone"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewZone'
      responses:
        '201':
          description: Zone created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Zone already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'

  /servers/{server}/zones/{zone}:
    delete:
      summary: Delete a zone
      tags: [ zones ]
      description: Removes a DNS zone from a specific server.
      operationId: delete_zone
      x-mojo-name: delete_zone
      x-mojo-to: "Zone#delete_zone"
      parameters:
        - name: server
          in: path
          required: true
          description: Unique name of the server
          x-mojo-placeholder: '#'
          schema:
            type: string
        - name: zone
          in: path
          required: true
          description: Unique name of the zone
          x-mojo-placeholder: '#'
          schema:
            type: string
      responses:
        '204':
          description: Zone deleted successfully
        '404':
          description: Server or zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'

components:
  schemas:
    ServerFields:
      type: object
      description: >
        Shared writable fields for server records. All properties are optional
        when updating; only 'name' is required when creating.
      properties:
        name:
          type: string
          description: Unique server name
          example: middle-earth
        comment:
          type: string
          nullable: true
          description: Server description
          example: Primary DNS for Middle Earth
        directory:
          type: string
          description: Base directory for named
          example: /var/named
        version:
          type: string
          nullable: true
          description: Version string to display
          example: "9.18"
        hostname:
          type: string
          nullable: true
          description: Primary servername for sibling zone SOAs
          example: ns1.example.com
        hostaddr:
          type: string
          nullable: true
          description: Primary server IP address
          example: 192.168.1.1
        hostmaster:
          type: string
          description: Hostmaster name for sibling zone SOAs
          example: admin.example.com
        pzone_path:
          type: string
          description: Relative path for master zone files
        szone_path:
          type: string
          description: Relative path for slave zone files
        named_ca:
          type: string
          description: Root servers filename
          default: named.ca
        pid_file:
          type: string
          nullable: true
          description: pid-file pathname
        dump_file:
          type: string
          nullable: true
          description: dump-file pathname
        named_xfer:
          type: string
          nullable: true
          description: named-xfer pathname
        stats_file:
          type: string
          nullable: true
          description: statistics-file pathname
        memstats_file:
          type: string
          nullable: true
          description: memstatistics-file pathname
        ttl:
          type: integer
          description: Default TTL for RR records
          example: 86400
        refresh:
          type: integer
          description: Default SOA refresh
          example: 43200
        retry:
          type: integer
          description: Default SOA retry
          example: 3600
        expire:
          type: integer
          description: Default SOA expire
          example: 2419200
        minimum:
          type: integer
          description: Default SOA minimum (negative caching TTL)
          example: 86400
        forward:
          type: string
          nullable: true
          description: "Forward setting: D=default, O=only, F=first"
          example: D
        recursion:
          type: string
          nullable: true
          description: "Recursion: D=default, Y=yes, N=no"
          example: D
        nnotify:
          type: string
          nullable: true
          description: "Notify: D=default, Y=yes, N=no"
          example: D
        dialup:
          type: string
          nullable: true
          description: "Dialup: D=default, Y=yes, N=no"
        multiple_cnames:
          type: string
          nullable: true
          description: "Multiple CNAMEs: D=default, Y=yes, N=no"
        rfc2308_type1:
          type: string
          nullable: true
          description: "RFC2308-type1: D=default, Y=yes, N=no"
        authnxdomain:
          type: string
          nullable: true
          description: "Auth NXDomain: D=default, Y=yes, N=no"
        checknames_m:
          type: string
          nullable: true
          description: "Check-names master: D=default, W=warn, F=fail, I=ignore"
        checknames_s:
          type: string
          nullable: true
          description: "Check-names slave: D=default, W=warn, F=fail, I=ignore"
        checknames_r:
          type: string
          nullable: true
          description: "Check-names response: D=default, W=warn, F=fail, I=ignore"
        query_src_ip:
          type: string
          nullable: true
          description: Query source IP (ip or '*')
        query_src_port:
          type: string
          nullable: true
          description: Query source port (port or '*')
        listen_on_port:
          type: string
          nullable: true
          description: Listen on port
        transfer_source:
          type: string
          nullable: true
          description: Transfer-source IP
        query_src_ip_v6:
          type: string
          nullable: true
          description: Query source IPv6 (ip or '*')
        query_src_port_v6:
          type: string
          nullable: true
          description: Query source port for IPv6 (port or '*')
        listen_on_port_v6:
          type: string
          nullable: true
          description: Listen on port for IPv6
        transfer_source_v6:
          type: string
          nullable: true
          description: Transfer-source IPv6
        zones_only:
          type: boolean
          description: If true, generate named.zones file; otherwise generate complete named.conf
          example: false
        no_roots:
          type: boolean
          description: If true, no root server (hint) zone entry is generated
          example: false
        masterserver:
          type: integer
          description: Master server ID for dynamic slave zones (-1 if none)
          example: -1
        df_port:
          type: integer
          description: DHCP failover listen port
          example: 519
        df_max_delay:
          type: integer
          description: DHCP failover max-response-delay
          example: 60
        df_max_uupdates:
          type: integer
          description: DHCP failover max-unacked-updates
          example: 10
        df_mclt:
          type: integer
          description: DHCP failover mclt
          example: 3600
        df_split:
          type: integer
          description: DHCP failover split
          example: 128
        df_loadbalmax:
          type: integer
          description: DHCP failover load balance max seconds
          example: 3
        df_port6:
          type: integer
          description: DHCPv6 failover listen port
          example: 520
        df_max_delay6:
          type: integer
          description: DHCPv6 failover max-response-delay
          example: 60
        df_max_uupdates6:
          type: integer
          description: DHCPv6 failover max-unacked-updates
          example: 10
        df_mclt6:
          type: integer
          description: DHCPv6 failover mclt
          example: 3600
        df_split6:
          type: integer
          description: DHCPv6 failover split
          example: 128
        df_loadbalmax6:
          type: integer
          description: DHCPv6 failover load balance max seconds
          example: 3
        allow_transfer:
          type: array
          description: ACL for zone transfers (cidr_entries type=1)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        allow_query:
          type: array
          description: ACL for queries (cidr_entries type=7)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        allow_recursion:
          type: array
          description: ACL for recursion (cidr_entries type=8)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        blackhole:
          type: array
          description: Blacklist (cidr_entries type=9)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        listen_on:
          type: array
          description: Listen-on ACL (cidr_entries type=10)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        listen_on_v6:
          type: array
          description: Listen-on ACL for IPv6 (cidr_entries type=16)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        allow_query_cache:
          type: array
          description: ACL for query cache (cidr_entries type=14)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        allow_notify:
          type: array
          description: ACL for notify (cidr_entries type=15)
          items:
            type: object
            properties:
              mode:
                type: integer
              ip:
                type: string
              acl:
                type: integer
              tkey:
                type: integer
              op:
                type: integer
              comment:
                type: string
                nullable: true
        forwarders:
          type: array
          description: DNS forwarders (cidr_entries type=11)
          items:
            type: object
            properties:
              ip:
                type: string
              comment:
                type: string
                nullable: true
        dhcp_l:
          type: array
          description: DHCP entries (dhcp_entries type=7)
          items:
            type: object
            properties:
              dhcp:
                type: string
              comment:
                type: string
                nullable: true
        dhcp:
          type: array
          description: DHCP entries (dhcp_entries type=1)
          items:
            type: object
            properties:
              dhcp:
                type: string
              comment:
                type: string
                nullable: true
        txt:
          type: array
          description: TXT entries (txt_entries type=3)
          items:
            type: object
            properties:
              txt:
                type: string
              comment:
                type: string
                nullable: true
        logging:
          type: array
          description: Logging options (txt_entries type=10)
          items:
            type: object
            properties:
              txt:
                type: string
              comment:
                type: string
                nullable: true
        custom_opts:
          type: array
          description: Custom BIND options (txt_entries type=11)
          items:
            type: object
            properties:
              txt:
                type: string
              comment:
                type: string
                nullable: true
        bind_globals:
          type: array
          description: BIND globals (txt_entries type=13)
          items:
            type: object
            properties:
              txt:
                type: string
              comment:
                type: string
                nullable: true
        dhcp6_l:
          type: array
          description: DHCPv6 entries (dhcp_entries type=17)
          items:
            type: object
            properties:
              dhcp:
                type: string
              comment:
                type: string
                nullable: true
        dhcp6:
          type: array
          description: DHCPv6 entries (dhcp_entries type=11)
          items:
            type: object
            properties:
              dhcp:
                type: string
              comment:
                type: string
                nullable: true

    Server:
      allOf:
        - $ref: '#/components/schemas/ServerFields'
        - type: object
          properties:
            id:
              type: integer
              example: 1
            lastrun:
              type: integer
              description: Last time server (DNS) configuration was generated
              example: 1711500000
            server_type:
              type: string
              description: Computed server role (Master or Slave for <name>)
              example: Master
            cdate:
              type: integer
              nullable: true
              description: Creation timestamp (Unix epoch)
            cuser:
              type: string
              nullable: true
              description: Created by user
            mdate:
              type: integer
              nullable: true
              description: Last modification timestamp (Unix epoch)
            muser:
              type: string
              nullable: true
              description: Last modified by user

    NewServer:
      allOf:
        - $ref: '#/components/schemas/ServerFields'
        - type: object
          required:
            - name
            - hostname
            - hostaddr
            - hostmaster
            - directory
          description: Schema for creating a new server.

    UpdateServer:
      allOf:
        - $ref: '#/components/schemas/ServerFields'
        - type: object
          description: >
            Schema for updating an existing server. All fields are optional;
            only provided fields are updated.

    NewZone:
      type: object
      required:
        - name
      properties:
        name:
          description: Zone name or CIDR for reverse zones
          type: string
          example: example.com
        type:
          type: string
          enum: [Master, Forward, Hint, Slave]
          default: Master
        reverse:
          type: boolean
          default: false

    Zone:
      type: object
      required:
        - id
        - name
        - server_id
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: example.com
        server_id:
          type: integer
          example: 1
        type:
          type: string
          example: M
        reverse:
          type: boolean
          example: false

    HostFields:
      type: object
      description: >
        Shared writable fields for host records. All properties are optional;
        which fields are valid depends on the host type.
      properties:
        ttl:
          type: integer
          nullable: true
          description: TTL for host records (default if null)
          example: 3600
        class:
          type: string
          nullable: true
          description: DNS class
          example: IN
        grp:
          type: integer
          nullable: true
          description: Group ID (-1 if none)
          example: -1
        alias:
          type: integer
          nullable: true
          description: Pointer to host record for CNAME alias (-1 if none)
          example: -1
        cname_txt:
          type: string
          nullable: true
          description: CNAME value for out-of-zone alias
          example: external.example.net.
        hinfo_hw:
          type: string
          nullable: true
          description: HINFO hardware
          example: x86_64
        hinfo_sw:
          type: string
          nullable: true
          description: HINFO software
          example: Linux
        router:
          type: integer
          nullable: true
          description: Router flag and priority (0=not a router, 1=highest priority)
          example: 0
        ips:
          type: array
          nullable: true
          items:
            type: string
          description: IP addresses assigned to this host
          example: ["192.168.1.100", "2001:db8::1"]
        ether:
          type: string
          nullable: true
          description: Ethernet MAC address
          example: "00:11:22:33:44:55"
        ether_alias:
          type: integer
          nullable: true
          description: Pointer to host record for ETHER address alias (-1 if none)
          example: -1
        info:
          type: string
          nullable: true
          description: Host info (appears as TXT record)
        location:
          type: string
          nullable: true
          description: Physical location
          example: "Building A, Room 101"
        dept:
          type: string
          nullable: true
          description: Department name
          example: IT
        huser:
          type: string
          nullable: true
          description: User associated with host
        email:
          type: string
          nullable: true
          description: User email address
        model:
          type: string
          nullable: true
          description: Host model info
          example: Dell PowerEdge R740
        serial:
          type: string
          nullable: true
          description: Serial number
          example: "SN-12345678"
        misc:
          type: string
          nullable: true
          description: Miscellaneous info
        asset_id:
          type: string
          nullable: true
          description: Asset ID
          example: "ASSET-12345"
        comment:
          type: string
          nullable: true
          example: "Web server"
        duid:
          type: string
          nullable: true
          description: DHCPv6 DUID
        iaid:
          type: integer
          nullable: true
          description: DHCPv6 IAID
        flags:
          type: integer
          nullable: true
          description: Reserved flags
          example: 0
        expiration:
          type: integer
          nullable: true
          description: Host expiration timestamp (Unix epoch, 0 if no expiry)
        ns_l:
          type: array
          description: NS records for delegated subdomains
          items:
            type: object
            required:
              - ns
            properties:
              ns:
                type: string
                description: Value of NS record (FQDN)
              comment:
                type: string
                nullable: true
        ds_l:
          type: array
          description: DS records for DNSSEC
          items:
            type: object
            required:
              - key_tag
              - algorithm
              - digest_type
              - digest
            properties:
              key_tag:
                type: integer
              algorithm:
                type: integer
              digest_type:
                type: integer
              digest:
                type: string
              comment:
                type: string
                nullable: true
        wks_l:
          type: array
          description: WKS records
          items:
            type: object
            required:
              - proto
              - services
            properties:
              proto:
                type: string
              services:
                type: string
              comment:
                type: string
                nullable: true
        mx_l:
          type: array
          description: MX records
          items:
            type: object
            required:
              - pri
              - mx
            properties:
              pri:
                type: integer
              mx:
                type: string
              comment:
                type: string
                nullable: true
        dhcp_l:
          type: array
          description: DHCP reservations
          items:
            type: object
            required:
              - dhcp
            properties:
              dhcp:
                type: string
              comment:
                type: string
                nullable: true
        printer_l:
          type: array
          description: Printer records
          items:
            type: object
            required:
              - printer
            properties:
              printer:
                type: string
              comment:
                type: string
                nullable: true
        srv_l:
          type: array
          description: SRV records
          items:
            type: object
            required:
              - pri
              - weight
              - port
              - target
            properties:
              pri:
                type: integer
              weight:
                type: integer
              port:
                type: integer
              target:
                type: string
              comment:
                type: string
                nullable: true
        sshfp_l:
          type: array
          description: SSHFP records
          items:
            type: object
            required:
              - algorithm
              - hashtype
              - fingerprint
            properties:
              algorithm:
                type: integer
                enum:  [0, 1, 2, 3, 4, 6]
                description: 0=Reserved, 1=RSA, 2=DSA, 3=ECDSA, 4=Ed25519, 6=Ed448
              hashtype:
                type: integer
                enum:  [0, 1, 2]
                description: 0=Reserved, 1=SHA-1, 2=SHA-256
              fingerprint:
                type: string
              comment:
                type: string
                nullable: true
        tlsa_l:
          type: array
          description: TLSA records
          items:
            type: object
            required:
              - usage
              - selector
              - matching_type
              - association_data
            properties:
              usage:
                type: integer
              selector:
                type: integer
              matching_type:
                type: integer
              association_data:
                type: string
              comment:
                type: string
                nullable: true
        txt_l:
          type: array
          description: TXT records
          items:
            type: object
            required:
              - txt
            properties:
              txt:
                type: string
              comment:
                type: string
                nullable: true
        alias_a:
          type: array
          description: Address records for type 7 alias arec
          items:
            type: object
            required:
              - arec
            properties:
              arec:
                type: string
        subgroups:
          type: array
          description: Group memberships
          items:
            type: object
            required:
              - grp
            properties:
              grp:
                type: integer
        dhcp_l6:
          type: array
          description: DHCPv6 reservations
          items:
            type: object
            required:
              - dhcp
            properties:
              dhcp:
                type: string
              comment:
                type: string
                nullable: true

    Host:
      allOf:
        - $ref: '#/components/schemas/HostFields'
        - type: object
          required:
            - id
            - domain
            - zone_id
            - fqdn
          properties:
            id:
              type: integer
              example: 100
            domain:
              type: string
              example: www
            fqdn:
              type: string
              example: www.example.com.
            zone_id:
              type: integer
              example: 10
            server_id:
              type: integer
              example: 1
            server:
              type: string
              example: example-server
            type:
              type: integer
              example: 1
              description: >
                Host type:
                0=misc, 1=host, 2=subdomain (delegation), 3=mx entry,
                4=alias (cname), 5=printer, 6=glue record, 7=alias (arec),
                8=srv entry, 9=dhcp only, 10=zone, 11=sshfp entry,
                12=tlsa entry, 13=txt entry, 14=naptr entry, 101=host reservation
            dhcp_date:
              type: integer
              nullable: true
              description: Last time host was issued a DHCP lease (Unix timestamp)
            dhcp_info:
              type: string
              nullable: true
              description: DHCP info
            cdate:
              type: integer
              nullable: true
              description: Creation timestamp (Unix epoch)
            cuser:
              type: string
              nullable: true
              description: Created by user
            mdate:
              type: integer
              nullable: true
              description: Last modification timestamp (Unix epoch)
            muser:
              type: string
              nullable: true
              description: Last modified by user

    NewHost:
      allOf:
        - $ref: '#/components/schemas/HostFields'
        - type: object
          required:
            - hostname
            - type
          description: >
            Schema for creating a new host. The server validates that only fields
            valid for the given host type are accepted; invalid fields trigger 400.
          properties:
            hostname:
              type: string
              description: Hostname within the zone (e.g., www, db01)
              example: www
            type:
              type: integer
              description: >
                Host type:
                0=misc, 1=host, 2=subdomain (delegation), 3=mx entry,
                4=alias (cname), 5=printer, 6=glue record, 7=alias (arec),
                8=srv entry, 9=dhcp only, 10=zone, 11=sshfp entry,
                12=tlsa entry, 13=txt entry, 14=naptr entry, 101=host reservation
              example: 1

    UpdateHost:
      allOf:
        - $ref: '#/components/schemas/HostFields'
        - type: object
          description: >
            Schema for updating an existing host. All fields are optional;
            only provided fields are updated. Array fields use replace-all
            semantics (all existing records of the same type are replaced).

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Internal Server Error
        message:
          type: string
          example: Database connection failed

  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-KEY
      in: header

security:
  - ApiKeyAuth: []

