server:
  name: server
  in: path
  required: true
  description: Unique name of the server
  x-mojo-placeholder: '#'
  schema:
    type: string
    example: middle-earth
zone:
  name: zone
  in: path
  required: true
  description: Name of the zone
  x-mojo-placeholder: '#'
  schema:
    type: string
    example: example.com
hostname:
  name: hostname
  in: path
  required: true
  description: Hostname within the zone
  x-mojo-placeholder: '#'
  schema:
    type: string
    example: bilbo

net:
  name: net
  in: path
  required: true
  description: >
    Network identifier — either the CIDR (e.g. 192.168.1.0/24) or the
    netname handle (e.g. office-net).
  x-mojo-placeholder: '#'
  schema:
    type: string
    example: 192.168.1.0/24

page:
  name: page
  in: query
  required: false
  description: Page number (1-based).
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 1

per_page:
  name: per_page
  in: query
  required: false
  description: Number of items per page (1..100).
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
    example: 50

