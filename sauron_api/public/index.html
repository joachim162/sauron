<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sauron API Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    h2 { margin-top: 0; color: #555; }
    label { display: block; margin: 10px 0 5px; font-weight: 500; }
    input { width: 100%; padding: 8px 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin: 10px 5px 0 0; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #c82333; }
    button.success { background: #28a745; }
    button.success:hover { background: #218838; }
    #output { background: #f8f9fa; padding: 15px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 13px; margin-top: 15px; max-height: 300px; overflow-y: auto; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .info { color: #17a2b8; }
    #user-info { background: #e9ecef; padding: 15px; border-radius: 4px; }
    #user-info dt { font-weight: 500; color: #666; }
    #user-info dd { margin: 5px 0 10px; }
  </style>
</head>
<body>
  <h1>Sauron API Test</h1>

  <section id="auth-section">
    <h2>Login</h2>
    <label for="email">Email</label>
    <input type="email" id="email" value="admin@example.com">
    <label for="password">Password</label>
    <input type="password" id="password" value="admin">
    <div>
      <button id="login-btn" onclick="login()">Login</button>
      <button id="logout-btn" class="danger" onclick="logout()" disabled>Logout</button>
    </div>
    <div id="output"></div>
  </section>

  <section id="status-section">
    <h2>Current User</h2>
    <button onclick="getMe()">Refresh</button>
    <dl id="user-info">
      <dt>Not logged in</dt>
      <dd></dd>
    </dl>
  </section>

  <section id="api-section">
    <h2>Test API Endpoints</h2>
    <button onclick="testServers()">GET /servers</button>
    <button onclick="testZones()">GET /zones</button>
  </section>

  <script>
    const API_BASE = '/api/v1';

    function log(msg, type = 'info') {
      const output = document.getElementById('output');
      const line = document.createElement('div');
      line.className = type;
      line.textContent = `${new Date().toLocaleTimeString()} ${msg}`;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function updateUserInfo(user) {
      const info = document.getElementById('user-info');
      if (!user) {
        info.innerHTML = '<dt>Not logged in</dt><dd></dd>';
        return;
      }
      info.innerHTML = `
        <dt>ID</dt><dd>${user.id}</dd>
        <dt>Username</dt><dd>${user.username}</dd>
        <dt>Email</dt><dd>${user.email || 'N/A'}</dd>
        <dt>Name</dt><dd>${user.name || 'N/A'}</dd>
        <dt>Superuser</dt><dd>${user.superuser ? 'Yes' : 'No'}</dd>
        <dt>Auth Level</dt><dd>${user.alevel}</dd>
        <dt>Auth Method</dt><dd>${user.auth_method}</dd>
      `;
    }

    function setLoggedIn(state) {
      document.getElementById('login-btn').disabled = state;
      document.getElementById('logout-btn').disabled = !state;
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      log(`Logging in as ${email}...`);
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        log(`Response: ${res.status} ${res.statusText}`);

        if (res.ok) {
          log(`Login successful: ${data.user.username}`, 'success');
          updateUserInfo(data.user);
          setLoggedIn(true);
        } else {
          log(`Login failed: ${data.error} - ${data.message}`, 'error');
          updateUserInfo(null);
          setLoggedIn(false);
        }
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function logout() {
      log('Logging out...');
      try {
        const res = await fetch(`${API_BASE}/auth/logout`, {
          method: 'POST',
          credentials: 'include'
        });

        const data = await res.json();
        log(`Response: ${res.status} ${res.statusText}`);
        log(`Logout: ${data.message}`, 'success');
        updateUserInfo(null);
        setLoggedIn(false);
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function getMe() {
      log('Fetching current user...');
      try {
        const res = await fetch(`${API_BASE}/auth/me`, {
          credentials: 'include'
        });

        const data = await res.json();
        log(`Response: ${res.status} ${res.statusText}`);

        if (res.ok) {
          log(`User: ${data.user.username}`, 'success');
          updateUserInfo(data.user);
          setLoggedIn(true);
        } else {
          log(`Not authenticated: ${data.message}`, 'error');
          updateUserInfo(null);
          setLoggedIn(false);
        }
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function testServers() {
      log('GET /servers...');
      try {
        const res = await fetch(`${API_BASE}/servers`, {
          credentials: 'include'
        });
        const data = await res.json();
        log(`Response: ${res.status} ${res.statusText}`);
        log(JSON.stringify(data, null, 2));
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function testZones() {
      log('GET /zones...');
      try {
        const res = await fetch(`${API_BASE}/zones`, {
          credentials: 'include'
        });
        const data = await res.json();
        log(`Response: ${res.status} ${res.statusText}`);
        log(JSON.stringify(data, null, 2));
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }
  </script>
</body>
</html>
