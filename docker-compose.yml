services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: saurondb
      POSTGRES_USER: sauronuser
      POSTGRES_PASSWORD: sauronpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauronuser -d saurondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  sauron_api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: saurondb
      POSTGRES_USER: sauronuser
      POSTGRES_PASSWORD: sauronpass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PERL5LIB: /srv/sauron
      PROXY_AUTH_TRUSTED_IPS: "127.0.0.1,::1,172.0.0.0/8"
    expose:
      - "3000"
    volumes:
      - .:/srv/sauron
    working_dir: /srv/sauron

  frontend:
    image: node:20-bookworm
    working_dir: /srv/sauron/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/srv/sauron
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://sauron_api:3000

  apache:
    build:
      context: .
      dockerfile: apache/Dockerfile
    depends_on:
      - sauron_api
      - frontend
    ports:
      - "8181:80"
      - "4343:443"
    environment:
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_CRYPTO_PASSPHRASE: "${OIDC_CRYPTO_PASSPHRASE:-changeme}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-https://localhost:4343/callback}"
      API_BACKEND: "http://sauron_api:3000"
      FRONTEND_BACKEND: "http://frontend:5173"
      SERVER_NAME: "${SERVER_NAME:-localhost}"
    env_file:
      - ".env"
    volumes:
      - ./apache/tls:/etc/apache2/tls

volumes:
  postgres_data:
