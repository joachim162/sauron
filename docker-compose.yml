services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: saurondb
      POSTGRES_USER: sauronuser
      POSTGRES_PASSWORD: sauronpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauronuser -d saurondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  sauron_api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: saurondb
      POSTGRES_USER: sauronuser
      POSTGRES_PASSWORD: sauronpass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PERL5LIB: /srv/sauron
    ports:
      - "3000:3000"
    volumes:
      - ./sauron_api/sauron_a_p_i.yml:/srv/sauron/sauron_api/sauron_a_p_i.yml:ro
      - ./test:/srv/sauron/test:ro
    working_dir: /srv/sauron

volumes:
  postgres_data:
